global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Thu thập metrics từ ứng dụng Nhà hàng (Node.js)
  - job_name: 'restaurant-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          app: 'restaurant-system'
          env: 'production'

  # Thu thập metrics từ chính Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
